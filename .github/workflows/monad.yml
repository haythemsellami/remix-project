name: Monad integration

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NX_NO_CLOUD: 'true'
      NX_DAEMON: 'false'
      NX_PARALLEL: '2'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Test the installed Monad package and provider
        run: yarn nx test remix-monad --skip-nx-cache
      - name: Check Monad types
        run: |
          yarn tsc -p libs/remix-monad/tsconfig.json --noEmit
          yarn tsc -p tests/monad/tsconfig.json
      - name: Lint browser tests
        run: yarn eslint playwright.monad.config.ts tests/monad/*.ts
      - name: Test existing disassembler behavior
        run: yarn ts-node --project tsconfig.base.json --require tsconfig-paths/register node_modules/.bin/tape libs/remix-debug/test/disassembler.ts
      - name: Build Remix with its VM workers and WASM asset
        run: yarn nx build remix-ide --configuration=development --skip-nx-cache
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium
      - name: Test browser execution and debugging
        run: yarn test:monad:browser
      - name: Upload browser report and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monad-browser-results
          path: |
            playwright-report/monad
            test-results/monad
          if-no-files-found: ignore
          retention-days: 7
